[project]
name = "sigma-predict"
version = "0.1.0"
description = "Probabilistic prediction system with multi-model estimation and statistical calibration"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "sigma-verify>=0.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "rich>=13.9.0",
    "click>=8.1.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.37.0",
    "plotly>=5.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.34.0",
]

[project.scripts]
sigma-predict = "scripts.predict:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]
